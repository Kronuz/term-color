<text x="18.0" y="56" >term-color demo  (this terminal detected as: truecolor)</text>
<text x="18.0" y="94" font-weight="bold">── one string, built at compile time, carries every tier ──</text>
<text x="18.0" y="113" >  raw bytes : \e[0;91m\e[0;38;5;196m\e[0;38;2;255;0;0mthe quick brown fox\e[0m\e[0m\e[0m</text>
<text x="18.0" y="151" font-weight="bold">── collapse() resolves it per terminal ──</text>
<text x="18.0" y="170" >  truecolor : </text>
<text x="136.0" y="170" fill="#ff0000">the quick brown fox</text>
<text x="296.2" y="170" >   (38;2;r;g;b)</text>
<text x="18.0" y="189" >  256-color : </text>
<text x="136.0" y="189" fill="#ff0000">the quick brown fox</text>
<text x="296.2" y="189" >   (38;5;n)</text>
<text x="18.0" y="208" >  16-color  : </text>
<text x="136.0" y="208" fill="#ff8a8f">the quick brown fox</text>
<text x="296.2" y="208" >   (30-37/90-97)</text>
<text x="18.0" y="227" >  none      : the quick brown fox   (stripped)</text>
<text x="18.0" y="246" >  (each line is the SAME source string, reduced to one tier)</text>
<text x="18.0" y="284" font-weight="bold">── 153 named colors (collapsed to this terminal) ──</text>
