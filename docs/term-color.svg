<text x="18.0" y="417" font-weight="bold">── bold (brgb) and the runtime color class ──</text>
<text x="18.0" y="436" >  </text>
<text x="34.9" y="436" fill="#ffd700" font-weight="bold">bold gold (brgb)</text>
<text x="18.0" y="455" >  color(0,128,128) -&gt; r=0 g=128 b=128, ansi() 38 bytes stacked</text>
<text x="18.0" y="493" font-weight="bold">── apply(): gate by mode / NO_COLOR, then collapse ──</text>
<text x="18.0" y="512" >  mode=always  : </text>
